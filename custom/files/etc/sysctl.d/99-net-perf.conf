# IPQ807x ~1GB class — local-service + conntrack headroom.
# Forwarding stays on NSS/ECM; these do not enable SW offload.
#
# Lexical name 99-* wins over qca-nss-ecm.conf (conntrack_max=32768).

net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
net.core.netdev_max_backlog = 2048

# ~20 MiB at 64k entries. Extra room for multi-gig + Tailscale + DoH.
net.netfilter.nf_conntrack_max = 65536
