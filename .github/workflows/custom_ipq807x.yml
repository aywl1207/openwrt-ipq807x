name: Build Custom IPQ807x NSS WiFi for devices

on:
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare build environment
    runs-on: self-hosted
    steps:
      - name: 'Cleanup build folder'
        run: |
          ls -la ./
          find . -maxdepth 1 ! -name 'dl' ! -name '.' -exec rm -rf {} +
          ls -la ./
          
      - name: Checkout
        uses: actions/checkout@v6.0.2
      
      - name: Set up Git configuration
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          
      - name: Extract LLVM prebuilt
        run: |
          wget https://downloads.openwrt.org/snapshots/targets/qualcommax/ipq807x/llvm-bpf-22.1.3.Linux-x86_64.tar.zst
          tar --zstd -xvf llvm-bpf-22.1.3.Linux-x86_64.tar.zst
      
      - name: Materialize custom overlay (custom/files → files/)
        run: |
          set -euo pipefail
          # /files is gitignored; durable overlay lives under custom/files/
          if [[ -d custom/files ]]; then
            mkdir -p files
            rsync -a custom/files/ files/
            find files/etc/init.d files/etc/uci-defaults -type f -exec chmod +x {} \; 2>/dev/null || true
            echo "Materialized files/ from custom/files/"
            find files -type f | sort
          else
            echo "WARNING: custom/files missing"
          fi
          if [[ -f custom/feeds.conf.append ]] && ! grep -q 'Tailscale VPN' feeds.conf.default 2>/dev/null; then
            cat custom/feeds.conf.append >> feeds.conf.default
          fi

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          ./scripts/feeds install tailscale || true

      - name: Optimize components (Go strip + RAM overlays)
        run: |
          set -euo pipefail
          chmod +x scripts/apply-component-optimize.sh scripts/apply-tailscale-optimize.sh
          test -x scripts/apply-component-optimize.sh
          ./scripts/apply-component-optimize.sh
     
      - name: Merge upstream and custom configs
        run: |
          set -euo pipefail
          test -f .full_config
          test -f clean_seed.config
          test -f seed_ipq807x_1g.config
          echo "==> 步驟 1：載入上游預設設定..."
          cp -f .full_config .config
          
          echo "==> 步驟 2：疊加自訂需求 (clean_seed + seed_ipq807x_1g)..."
          cat clean_seed.config >> .config
          cat seed_ipq807x_1g.config >> .config

      - name: Check config
        run: |
          set -euo pipefail
          echo "==> 步驟 3：自動計算相依性並生成最終完美 .config..."
          make defconfig
          echo "==> 步驟 3b：確認 Tailscale / NSS / 1GB mem 關鍵符號..."
          grep -E '^CONFIG_PACKAGE_tailscale=y$' .config
          grep -E '^CONFIG_PACKAGE_kmod-qca-nss-drv=y$' .config
          grep -E '^CONFIG_PACKAGE_kmod-qca-nss-ecm=y$' .config
          grep -E '^CONFIG_PACKAGE_kmod-qca-nss-crypto=y$' .config
          grep -E '^CONFIG_PACKAGE_nss-eip-firmware=y$' .config
          grep -E '^CONFIG_PACKAGE_adguardhome=y$' .config
          grep -E '^CONFIG_PACKAGE_cloudflared=y$' .config
          grep -E '^CONFIG_PACKAGE_luci-theme-argon=y$' .config
          grep -E '^CONFIG_IPQ_MEM_PROFILE_1024=y$|^CONFIG_KERNEL_IPQ_MEM_PROFILE=1024$' .config
        
      - name: Ensure rootfs overlay permissions (from custom/files)
        run: |
          set -euo pipefail
          # Durable QoL lives under custom/files (materialized by optimize step):
          #   16_ensure_lan_dhcpv4     — LAN DHCPv4 only
          #   97-sqm-nss-optimize      — nss-zk.qos pin; classic qos off
          #   98-component-optimize    — zram / AGH / cloudflared
          #   99-qol_nss_tailscale     — ECM/NSS offload + Tailscale enable
          #   99-qol_wireless          — country / radios
          #   etc/init.d/{tailscale,cloudflared} — GOGC / GOMEMLIMIT
          #   etc/config/{adguardhome,cloudflared,mdns_repeater,sqm}
          #   usr/lib/sqm/nss-zk.qos   — fork-tuned NSS shaper
          find files/etc/init.d files/etc/uci-defaults -type f -exec chmod +x {} \; 2>/dev/null || true
          test -x files/etc/uci-defaults/16_ensure_lan_dhcpv4
          test -x files/etc/uci-defaults/97-sqm-nss-optimize
          test -x files/etc/uci-defaults/98-component-optimize
          test -x files/etc/uci-defaults/99-qol_nss_tailscale
          test -x files/etc/uci-defaults/99-qol_wireless
          test -x files/etc/init.d/tailscale
          test -x files/etc/init.d/cloudflared
          test -f files/usr/lib/sqm/nss-zk.qos
          test -f files/etc/config/sqm
          grep -q 'GOGC=10' files/etc/init.d/tailscale
          grep -q 'GOGC=10' files/etc/init.d/cloudflared
          grep -q "option gc '20'" files/etc/config/adguardhome
          grep -q 'nss-zk.qos' files/etc/config/sqm
          grep -q 'interval 50ms' files/usr/lib/sqm/nss-zk.qos
          # Never let first-boot scripts rewrite WAN or invent DHCP policy beyond 16_
          ! grep -qE 'network\.wan|dhcp\.wan' files/etc/uci-defaults/* 2>/dev/null || true
          ! grep -qE 'dhcp\.|network\.lan' files/etc/uci-defaults/99-qol_wireless
          ! grep -qE 'dhcp\.|network\.lan' files/etc/uci-defaults/99-qol_nss_tailscale
          ! grep -qE 'dhcp\.|network\.lan' files/etc/uci-defaults/98-component-optimize
          ! grep -qE 'dhcp\.|network\.lan' files/etc/uci-defaults/97-sqm-nss-optimize


  download:
    name: Download package sources
    runs-on: self-hosted
    needs: prepare
    steps:
      - name: Download package sources
        run: |
          make download -j$(nproc) V=s || make download V=s
          make clean

  build_tools:
    name: Build tools
    runs-on: self-hosted
    needs: download
    steps:
      - name: Build tools
        run: make tools/install -j$(nproc) V=s || make tools/install V=s

  build_toolchain:
    name: Build toolchain
    runs-on: self-hosted
    needs: build_tools
    steps:
      - name: Build toolchain
        env:
          KBUILD_BUILD_USER: "openwrt"
          KBUILD_BUILD_HOST: "build-server"
        run: make toolchain/install -j$(nproc) V=s || make toolchain/install V=s

  build_images:
    name: Build target images
    runs-on: self-hosted
    needs: build_toolchain
    steps:
      - name: Build target images
        env:
          KBUILD_BUILD_USER: "openwrt"
          KBUILD_BUILD_HOST: "build-server"
        run: make -j$(nproc) V=s || make V=s

  release:
    name: Create release
    runs-on: self-hosted
    needs: build_images
    steps:
      - name: Get the current date
        run: echo "NOW=$(date +%F-%H%M)" >> $GITHUB_ENV
      - name: Create a release
        uses: ncipollo/release-action@v1
        with:
          name: "${{ env.NOW }} | Updated custom prebuilt images for devices (NSS-WiFi unified)"
          commit: "custom_main_nss"
          tag: "ipq807x-nsswifi-unified-${{ env.NOW }}"
          generateReleaseNotes: true
          makeLatest: true
          artifacts: bin/targets/qualcommax/ipq807x/*
          token: "${{ secrets.GITHUB_TOKEN }}"
