name: Build IPQ807x NSS (fork)

# Self-hosted multi-device image build.
# All fork logic lives in custom/scripts — keep this workflow thin.
#
# Cache policy (self-hosted): never delete package download cache (dl/).
# actions/checkout must use clean:false so git clean -ffdx does not wipe dl/.

on:
  workflow_dispatch:

jobs:
  prepare:
    name: Prepare
    runs-on: self-hosted
    steps:
      - name: Cleanup build outputs (keep dl/ download cache)
        run: |
          set -euo pipefail
          echo "Before cleanup:"
          ls -la ./ || true
          # Wipe top-level entries except download cache.
          # Do NOT remove: dl  (OpenWrt package tarballs / go-mod cache)
          find . -maxdepth 1 ! -name 'dl' ! -name '.' ! -name '..' -exec rm -rf {} +
          mkdir -p dl
          echo "After cleanup (dl/ preserved):"
          ls -la ./
          du -sh dl 2>/dev/null || true

      - name: Checkout
        uses: actions/checkout@v6.0.2
        with:
          # Default clean:true runs `git clean -ffdx` and deletes untracked dl/.
          clean: false
          # Avoid discarding local untracked caches when syncing the tree
          # (self-hosted reuses the workdir between dispatches).

      - name: Ensure dl/ still present after checkout
        run: |
          set -euo pipefail
          mkdir -p dl
          echo "dl/ status:"
          ls -la dl | head -20 || true
          du -sh dl 2>/dev/null || true

      - name: Git identity
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Extract LLVM prebuilt
        run: |
          set -euo pipefail
          # Cache llvm tarball under dl/ so re-runs skip re-download when possible
          LLVM_VER="llvm-bpf-22.1.3.Linux-x86_64.tar.zst"
          LLVM_URL="https://downloads.openwrt.org/snapshots/targets/qualcommax/ipq807x/${LLVM_VER}"
          mkdir -p dl
          if [ ! -f "dl/${LLVM_VER}" ]; then
            wget -q -O "dl/${LLVM_VER}" "${LLVM_URL}"
          fi
          tar --zstd -xf "dl/${LLVM_VER}"

      - name: Prepare fork (overlay + feeds + Go optimize)
        run: |
          set -euo pipefail
          chmod +x custom/scripts/*.sh
          ./custom/scripts/prepare.sh --feeds

      - name: Config stack + verify
        run: |
          set -euo pipefail
          # shellcheck disable=SC1091
          source custom/scripts/common.sh
          merge_config_stack
          make defconfig
          # Force DEVICE_PACKAGES into rootfs (=y not =m) — prevents RO overlay / missing board data
          force_device_rootfs_packages
          make defconfig
          ./custom/scripts/verify-config.sh
          ./custom/scripts/verify-overlay.sh

  download:
    name: Download
    runs-on: self-hosted
    needs: prepare
    steps:
      - name: Download package sources
        run: |
          set -euo pipefail
          # Populate/reuse ./dl only — do not make clean (would wipe build trees
          # for no benefit here; dl/ is never removed by make download).
          make download -j"$(nproc)" V=s || make download V=s
          echo "dl/ after download:"
          du -sh dl 2>/dev/null || true

  build_tools:
    name: Tools
    runs-on: self-hosted
    needs: download
    steps:
      - name: Build tools
        run: make tools/install -j"$(nproc)" V=s || make tools/install V=s

  build_toolchain:
    name: Toolchain
    runs-on: self-hosted
    needs: build_tools
    steps:
      - name: Build toolchain
        env:
          KBUILD_BUILD_USER: openwrt
          KBUILD_BUILD_HOST: build-server
        run: make toolchain/install -j"$(nproc)" V=s || make toolchain/install V=s

  build_images:
    name: Images
    runs-on: self-hosted
    needs: build_toolchain
    steps:
      - name: Build world
        env:
          KBUILD_BUILD_USER: openwrt
          KBUILD_BUILD_HOST: build-server
        run: make -j"$(nproc)" V=s || make -j1 V=s

  release:
    name: Release
    runs-on: self-hosted
    needs: build_images
    steps:
      - name: Date stamp
        run: echo "NOW=$(date +%F-%H%M)" >> "$GITHUB_ENV"
      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          name: "${{ env.NOW }} | IPQ807x NSS-WiFi unified"
          commit: custom_main_nss
          tag: "ipq807x-nsswifi-unified-${{ env.NOW }}"
          generateReleaseNotes: true
          makeLatest: true
          artifacts: bin/targets/qualcommax/ipq807x/*
          token: ${{ secrets.GITHUB_TOKEN }}
